name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SRT_VERSION: "0.0.81"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at about 10x Linux ($0.062 vs $0.006 per minute) and used up most of the
        # $18/month GitHub Pro allowance. Run macOS by hand (workflow_dispatch) or locally when needed.
        os: [ubuntu-latest]
        # `os` stays "ubuntu-latest" so the required check name "test (ubuntu-latest)" does not change.
        # `runner` pins the image: ubuntu-latest moved to 26.04 on 2026-11-17, where bubblewrap/srt fails
        # with "apply-seccomp: ... nested userns is capability-restricted" (34 sandbox tests). Last green: 24.04.
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --locked --group dev

      - name: Install sandbox runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat ripgrep
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install sandbox runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install the sandbox runtime
        run: |
          npm install -g @anthropic-ai/sandbox-runtime@${{ env.SRT_VERSION }}
          srt --version

      - name: Run tests
        env:
          AGENT_TEAM_REQUIRE_SRT: "1"
        run: uv run pytest -q

      - name: Prove the console script installs as a tool
        run: |
          uv tool install --force .
          agent-team --version | tee /tmp/version.txt
          /usr/bin/grep -qx "agent-team 0.1.0" /tmp/version.txt
