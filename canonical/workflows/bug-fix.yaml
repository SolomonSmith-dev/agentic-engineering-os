kind: workflow
name: bug-fix
purpose: Reproduce, fix and review one bug; open a draft PR gated on the reviewer's verdict.
# Section 5 of docs/ARCHITECTURE.md, as a linear chain. BLOCKED, RESUME and the
# run's end are handled by the orchestrator, so they are not listed here.
# Large evidence (the diff, the test output, the verdict) is a file under
# .agent-team/artifacts/<run-id>/; the evidence holds its path and the commit it describes.
states: [INTAKE, DISCOVERY, PLAN, IMPLEMENTATION, TEST, CODE_REVIEW, PR, HUMAN_DECISION]
nodes:
  INTAKE: { step: intake, evidence: [task] }
  # The MVP has no debugger agent; the implementer reproduces, in its own process,
  # and the orchestrator re-runs the reproduction in the sandbox (reproduction_check).
  DISCOVERY:
    agent: implementer
    evidence: [reproduction_command, reproduction_fails, reproduction_check]
  # One synthetic acceptance criterion when the task gives none: the reproduction passes.
  PLAN:
    step: plan
    evidence: [plan]
    inputs: [reproduction_command]
  # The diff is cut by the orchestrator from the branch; claimed_changes is the implementer's word.
  IMPLEMENTATION:
    agent: implementer
    evidence: [diff, claimed_changes]
    inputs: [plan, reproduction_command, findings]
  # Orchestrator-run, in the sandbox, on exactly the commit the diff ends at.
  TEST:
    step: test
    evidence: [test_output, tests_pass]
    inputs: [reproduction_command, diff]
  # Fresh process: the plan, the diff and the orchestrator's test output, never a transcript.
  CODE_REVIEW:
    agent: independent-reviewer
    evidence: [reviewer_verdict, findings, review]
    inputs: [plan, diff, test_output]
  PR:
    step: pr
    evidence: [pr]
    inputs: [plan, reproduction_command, reproduction_check, diff, claimed_changes, test_output, tests_pass, reviewer_verdict, findings, review]
  HUMAN_DECISION: { step: human_decision, inputs: [pr] }
transitions:
  - { from: INTAKE, to: DISCOVERY }
  - { from: DISCOVERY, to: PLAN, gate: reproduction_fails } # reproduction recorded before the fix
  - { from: PLAN, to: IMPLEMENTATION }
  - { from: IMPLEMENTATION, to: TEST }
  - { from: TEST, to: CODE_REVIEW, gate: tests_pass } # the regression test passes after the fix
  - { from: CODE_REVIEW, to: PR, gate: reviewer_verdict == approve }
  - { from: CODE_REVIEW, to: IMPLEMENTATION, gate: reviewer_verdict == changes, max_traversals: 1 }
  - { from: CODE_REVIEW, to: PR, gate: reviewer_verdict == escalate, escalate: true }
  - { from: PR, to: HUMAN_DECISION }
definition_of_done:
  - the reproduction command fails before the fix and passes after it
  - a draft PR exists on a branch the run owns
  - the reviewer verdict and findings are in the PR body
  - an escalated run's draft PR is marked blocked
  - every state transition is in the run record with cost
