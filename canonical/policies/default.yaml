kind: policy
name: default
autonomy_ceiling:
  independent-reviewer: A2
  repository-archaeologist: A0 # inspect: reads only; agent-team runs the detected commands itself
protected_paths: [".env*", "~/.claude/**", ".agent-team/**"]
denied_capabilities: [git.push.main, fs.write.home]
redaction:
  - name: api-keys
    pattern: "(sk|ghp|gho|github_pat)_[A-Za-z0-9_]{16,}"
required_gates: [tests_pass, reviewer_verdict]
default_autonomy: A0
