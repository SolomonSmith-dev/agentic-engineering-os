[project]
name = "agent-team"
version = "0.1.0"
description = "Agentic engineering OS: an agent-team CLI that runs Claude Code workers and an independent reviewer in sandboxed git worktrees."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Solomon Smith" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/SolomonSmith-dev/agentic-engineering-os"

[project.scripts]
agent-team = "agent_team.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.8",
    "vulture>=2.13",
]
# Baseline A of the step 13 eval, never a default dependency: `uv sync --group dev --group baseline`.
baseline = [
    "mini-swe-agent==2.4.6",
    # mini-swe-agent's model client; held at a release more than two weeks old when this was locked.
    "litellm==1.104.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_team"]

# The installed tool runs from a target repository, so it carries its own canonical files and
# model registry under agent_team/_bundled/ (see src/agent_team/paths.py).
[tool.hatch.build.targets.wheel.force-include]
"canonical" = "agent_team/_bundled/canonical"
"routing" = "agent_team/_bundled/routing"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "srt: runs a command under the real srt sandbox (skips without srt unless AGENT_TEAM_REQUIRE_SRT=1)",
    "live: calls a real model through claude and srt; opt-in with AGENT_TEAM_LIVE=1, never in CI",
]

# Anti-slop gate. Existing debt carries a `# noqa` (a ratchet): new code gets no exemption.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "C90", "B", "SIM", "RET", "BLE", "S", "PLR0912", "PLR0915", "T20"]
ignore = [
    "E501",  # 1,500+ existing long lines; the formatter is not enforced yet
    "S603",  # this tool's job is to run subprocesses with argument lists
    "S607",  # git, claude, codex and srt are resolved from PATH by design
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR0915", "F811"]
