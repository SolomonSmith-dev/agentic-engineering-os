[project]
name = "agent-team"
version = "0.0.1"
description = "Agentic engineering OS: an agent-team CLI that runs Claude Code workers and an independent reviewer in sandboxed git worktrees."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Solomon Smith" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/SolomonSmith-dev/agentic-engineering-os"

[project.scripts]
agent-team = "agent_team.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
